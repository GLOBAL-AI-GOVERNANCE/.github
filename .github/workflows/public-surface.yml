name: Public Surface

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check public surface
        run: python3 -B tools/check_public_surface.py .
      - name: Check reachable history privacy
        run: python3 -B tools/check_history_privacy.py
      - name: Validate claims integrity
        run: python3 -B tools/validate_claims_integrity.py
